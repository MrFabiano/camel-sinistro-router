services:
  seguros-camel-router:
    image: seguros/camel-router:1.0.0
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: seguros-camel-router
    environment:
      TZ: America/Sao_Paulo
      JAVA_OPTS_APPEND: "-Duser.timezone=America/Sao_Paulo"
      QUARKUS_PROFILE: prod
      CAMEL_COMPONENT_KAFKA_BROKERS: kafka:29092
    ports:
      - "8081:8081"
    networks:
      - seguros-network

networks:
  seguros-network:
    external: true
    name: seguros-network