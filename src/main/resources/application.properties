quarkus.http.port=8081

# Kafka (em Docker o compose sobrescreve via variável de ambiente)
app.kafka.topic=seguros.sinistros.events
camel.component.kafka.brokers=${CAMEL_COMPONENT_KAFKA_BROKERS:localhost:9092}
quarkus.kafka.devservices.enabled=false

# Health
quarkus.smallrye-health.enabled=true
quarkus.smallrye-health.show-details=always

# Camel passa a expor o contrato do REST DSL
#camel.rest.api-context-path=/api-doc
# Mostra o contrato do Camel no endpoint do Quarkus (/q/openapi). Fixo em tempo de build.
#quarkus.camel.openapi.expose.enabled=true

quarkus.smallrye-openapi.info-title=Camel Router - Sinistro
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Caminho alternativo de publicação de eventos de sinistro no Kafka

# Swagger UI também na imagem Docker (por padrão só em dev e test)
quarkus.swagger-ui.always-include=true